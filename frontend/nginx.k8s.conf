# SPA only — /api is routed by NGINX Ingress to the API service (see k8s/ingress.yaml).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    gzip_static on;
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/javascript application/json application/xml+rss image/svg+xml;

    location ~* \.(js|css|woff2|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
