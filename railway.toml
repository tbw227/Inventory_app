# Railway config-as-code (repo root). Set Service → Root Directory = backend in the dashboard.
# Uses Nixpacks (no Docker). See docs/RAILWAY.md

[build]
builder = "NIXPACKS"
watchPatterns = ["backend/**"]

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
