# Render Blueprint — Express API (Docker) + Supabase Postgres
# https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Or: create a Web Service manually (Docker) with root directory `backend`.

services:
  - type: web
    name: inventory-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Supabase: Session pooler (pgbouncer) for runtime — see backend/.env.sample
      - key: DATABASE_URL
        sync: false
      # Supabase: Direct connection for Prisma migrate on startup
      - key: DIRECT_URL
        sync: false
      # Comma-separated — include your Vercel app URL(s)
      - key: FRONTEND_URL
        sync: false
      - key: MARKETING_URL
        sync: false
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "true"
      - key: RATE_LIMIT_MAX
        value: "100"
      # Optional: shared cache across instances (Upstash Redis URL)
      # - key: REDIS_URL
      #   sync: false
